<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taiwan Travel Planner</title>
  <meta name="description" content="Single page Taiwan travel itinerary with CSV import/export and offline storage." />
  <style>
    :root {
      --bg: #f6fbff;
      --accent: #5c8dff;
      --accent2: #ff94b8;
      --ink: #0f1a2b;
      --muted: #5b6b7b;
      --card: #ffffffcc;
      --radius: 18px;
      --shadow: 0 12px 30px rgba(15, 26, 43, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 700px at 20% -10%, #d7ecff80, transparent 45%),
                  radial-gradient(900px 600px at 90% -10%, #ffdfe980, transparent 45%),
                  linear-gradient(180deg, #f9fdff, #fef5ff);
      color: var(--ink);
      min-height: 100vh;
    }

    .app { max-width: 1100px; margin: 0 auto; padding: 18px 14px 32px; }

    header {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      position: sticky;
      top: 10px;
      z-index: 10;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,26,43,0.08);
    }
    @media (max-width: 780px) { header { grid-template-columns: 1fr; position: static; } }

    h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    button, .chip {
      appearance: none;
      border: 1px solid rgba(15,26,43,0.12);
      background: #fff;
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(15,26,43,0.08);
      transition: transform .06s ease, box-shadow .2s ease, background .2s ease;
      color: var(--ink);
    }
    button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    button:active { transform: translateY(0); }
    .primary { background: linear-gradient(135deg, #6ab8ff, #ffb0d8); color: #0f1a2b; border: none; }
    .ghost { background: rgba(255,255,255,0.72); }

    .searchBox { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 14px; padding: 10px 12px; box-shadow: 0 8px 16px rgba(15,26,43,0.08); border: 1px solid rgba(15,26,43,0.08); }
    .searchBox input { border: none; outline: none; flex: 1; font-size: 14px; background: transparent; }

    nav { margin-top: 14px; overflow-x: auto; padding-bottom: 6px; }
    .tabs { display: inline-flex; gap: 8px; }
    .tab { padding: 9px 12px; border-radius: 12px; background: #fff; border: 1px solid rgba(15,26,43,0.1); font-weight: 800; cursor: pointer; white-space: nowrap; }
    .tab[aria-selected="true"] { background: linear-gradient(135deg, #e7f3ff, #ffe9f2); border-color: #6ab8ff; }

    .filterRow { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { padding: 8px 10px; border-radius: 12px; border: 1px solid rgba(15,26,43,0.12); background: #fff; cursor: pointer; font-weight: 700; }
    .pill[aria-pressed="true"] { background: rgba(92,141,255,0.15); border-color: #5c8dff; }

    .cards { margin-top: 12px; display: grid; gap: 10px; }
    .card {
      position: relative;
      padding: 14px 14px 12px 18px;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.82);
      box-shadow: var(--shadow);
      border: 1px solid rgba(15,26,43,0.08);
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 640px) { .card { grid-template-columns: 1fr; } }

    .timelineDot { width: 14px; height: 14px; border-radius: 50%; background: #5c8dff; box-shadow: 0 0 0 4px rgba(92,141,255,0.25); margin-top: 4px; position: relative; }
    .timelineDot::after { content: ""; position: absolute; left: 50%; top: 14px; width: 2px; height: calc(100% + 18px); background: rgba(15,26,43,0.08); transform: translateX(-50%); }
    .card:last-child .timelineDot::after { display: none; }

    .card h3 { margin: 0; font-size: 16px; }
    .muted { color: var(--muted); font-size: 13px; }
    .timeTag { display: inline-flex; gap: 6px; align-items: center; padding: 6px 9px; border-radius: 10px; background: rgba(92,141,255,0.12); font-weight: 800; font-size: 13px; }
    .addr { margin-top: 6px; word-break: break-word; }
    .notes { margin-top: 6px; font-size: 13px; background: rgba(15,26,43,0.03); border-radius: 10px; padding: 8px 10px; }
    .actionsRow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .next { border-color: #ff94b8; box-shadow: 0 12px 26px rgba(255,148,184,0.32); }

    .empty { text-align: center; padding: 18px; color: var(--muted); }

    dialog { border: none; border-radius: 20px; padding: 0; box-shadow: var(--shadow); max-width: 720px; width: min(95vw, 760px); }
    dialog::backdrop { background: rgba(0,0,0,0.24); }
    .modal { padding: 16px; background: #fff; border-radius: 20px; }
    .modal h2 { margin: 0 0 10px; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    .field label { font-weight: 700; font-size: 13px; color: var(--muted); }
    .field input, .field textarea, .field select { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid rgba(15,26,43,0.12); font-size: 14px; }
    textarea { min-height: 120px; }
    .stepper { display: grid; gap: 10px; }
    .mapGrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .preview { background: rgba(15,26,43,0.03); padding: 10px; border-radius: 12px; font-size: 13px; }
    .error { color: #b00020; font-weight: 700; font-size: 13px; }

    footer { text-align: center; margin-top: 20px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>🇹🇼 Taiwan Travel Planner</h1>
        <div class="sub">Simple, friendly, offline-ish. Paste or upload CSV from Google Sheets.</div>
        <div class="searchBox" aria-label="Search">
          <span aria-hidden="true">🔎</span>
          <input id="search" type="search" placeholder="Search place or address" />
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="btnImport">⬆️ Import</button>
        <button class="ghost" id="btnExportCsv">⬇️ Export CSV</button>
        <button class="ghost" id="btnExportJson">⬇️ Export JSON</button>
        <button class="ghost" id="btnReset">🧼 Reset</button>
      </div>
    </header>

    <nav aria-label="Days">
      <div class="tabs" id="tabs"></div>
    </nav>

    <div class="filterRow">
      <button class="pill" data-filter="all" aria-pressed="true">Anytime</button>
      <button class="pill" data-filter="morning">Morning</button>
      <button class="pill" data-filter="afternoon">Afternoon</button>
      <button class="pill" data-filter="evening">Evening</button>
    </div>

    <section class="cards" id="cards"></section>
    <div class="empty" id="empty" hidden>No matching stops. Try clearing filters.</div>

    <footer>Made with pastel vibes • Data stays in your browser (localStorage)</footer>
  </div>

  <dialog id="importDialog">
    <div class="modal">
      <div style="display:flex; justify-content: space-between; gap:8px; align-items:center; flex-wrap:wrap;">
        <h2>Import from Google Sheets CSV</h2>
        <button class="ghost" id="closeImport">✖ Close</button>
      </div>

      <div class="stepper">
        <div class="field">
          <label>1) Paste public CSV URL</label>
          <input id="csvUrl" placeholder="https://docs.google.com/.../pub?output=csv" />
          <button class="primary" id="fetchCsv">Fetch URL</button>
        </div>

        <div class="field">
          <label>2) Or upload CSV file</label>
          <input id="csvFile" type="file" accept=".csv,text/csv" />
        </div>

        <div class="field">
          <label>3) Or paste CSV text</label>
          <textarea id="csvText" placeholder="Day,StartTime,PlaceName,Address"></textarea>
          <button class="ghost" id="useText">Use pasted CSV</button>
        </div>

        <div id="mapSection" hidden>
          <h3>Map columns</h3>
          <div class="mapGrid" id="mapGrid"></div>
          <div class="preview" id="preview"></div>
          <div class="error" id="importError" role="alert"></div>
          <div style="display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:6px;">
            <button class="ghost" id="cancelImport">Cancel</button>
            <button class="primary" id="confirmImport">Import</button>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <script>
    /* DATA MODEL
      itinerary = [
        { id: 'day1', title: 'Day 1', date: '2026-02-18', entries: [
            { start: '09:00', end: '10:00', place: 'Taichung HSR', address: '8 Zhanqu 2nd Rd, Taichung', maps: 'https://...', notes: 'Pick up easycard' }
        ]}
      ]
      Stored in localStorage under STORAGE_KEY. Cards sorted by start time when available.
    */

    const STORAGE_KEY = 'tw-itinerary-v2';
    const $ = (q, el=document) => el.querySelector(q);
    const $$ = (q, el=document) => Array.from(el.querySelectorAll(q));
    const tabs = $('#tabs');
    const cards = $('#cards');
    const empty = $('#empty');
    const searchInput = $('#search');
    const importDialog = $('#importDialog');
    const mapSection = $('#mapSection');
    const mapGrid = $('#mapGrid');
    const preview = $('#preview');
    const importError = $('#importError');

    let itinerary = loadData();
    let activeDay = itinerary[0]?.id || 'day1';
    let timeFilter = 'all';

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try { return JSON.parse(raw); } catch (e) { console.warn('Failed to parse saved data', e); }
      }
      return sampleData();
    }

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(itinerary)); }

    function sampleData() {
      return [
        { id: 'day1', title: 'Day 1', date: '2026-02-18', entries: [
          { start: '09:30', end: '10:30', place: 'Taichung HSR Station', address: '8 Zhanqu 2nd Rd, Wuri District, Taichung', maps: '', notes: 'Pick up EasyCard & SIM.' },
          { start: '11:30', end: '13:00', place: 'Chun Shui Tang', address: '30 Siwei St, Taichung', maps: '', notes: 'Original bubble tea!' },
          { start: '16:00', end: '18:00', place: 'Gaomei Wetlands', address: 'Qingshui District, Taichung City', maps: '', notes: 'Sunset boardwalk.' }
        ]},
        { id: 'day2', title: 'Day 2', date: '2026-02-19', entries: [
          { start: '10:00', end: '12:00', place: 'National Taichung Theater', address: '101 Sec 2, Huilai Rd, Xitun', maps: '', notes: 'Futuristic curves & photo time.' },
          { start: '18:30', end: '21:00', place: 'Fengjia Night Market', address: 'Xitun District, Taichung City', maps: '', notes: 'Street food crawl.' }
        ]},
        { id: 'day3', title: 'Day 3', date: '2026-02-20', entries: [
          { start: '09:00', end: '11:30', place: 'Chiang Kai-shek Memorial Hall', address: '21 Zhongshan S Rd, Taipei', maps: '', notes: 'Changing of the guards.' },
          { start: '12:30', end: '13:30', place: 'Yongkang Beef Noodles', address: '17 Ln 31, Sec 2, Jinshan S Rd, Taipei', maps: '', notes: 'Lunch stop.' },
          { start: '18:00', end: '21:00', place: 'Raohe Night Market', address: 'Raohe St, Songshan District, Taipei', maps: '', notes: 'Pepper bun & mochi.' }
        ]}
      ];
    }

    function renderTabs() {
      tabs.innerHTML = '';
      itinerary.forEach((day, idx) => {
        const b = document.createElement('button');
        b.className = 'tab';
        b.textContent = `${day.title || ('Day ' + (idx + 1))}${day.date ? ' • ' + day.date : ''}`;
        b.setAttribute('aria-selected', day.id === activeDay);
        b.onclick = () => { activeDay = day.id; render(); };
        tabs.appendChild(b);
      });
    }

    function matchesFilter(entry) {
      if (timeFilter === 'all' || !entry.start) return true;
      const [h] = entry.start.split(':').map(Number);
      if (timeFilter === 'morning') return h < 12;
      if (timeFilter === 'afternoon') return h >= 12 && h < 17;
      if (timeFilter === 'evening') return h >= 17;
      return true;
    }

    function renderCards(day) {
      cards.innerHTML = '';
      const term = searchInput.value.trim().toLowerCase();
      const entries = [...day.entries].sort((a,b) => (a.start||'') > (b.start||'') ? 1 : -1)
        .filter(e => matchesFilter(e))
        .filter(e => !term || (e.place && e.place.toLowerCase().includes(term)) || (e.address && e.address.toLowerCase().includes(term)));

      const nextIdx = findNextIndex(entries);

      entries.forEach((e, idx) => {
        const card = document.createElement('article');
        card.className = 'card' + (idx === nextIdx ? ' next' : '');

        const dot = document.createElement('div');
        dot.className = 'timelineDot';
        card.appendChild(dot);

        const main = document.createElement('div');
        main.innerHTML = `<div class="timeTag">${formatTime(e)}</div><h3>${escapeHtml(e.place || 'Untitled')}</h3>`;
        if (e.address) {
          const addr = document.createElement('div');
          addr.className = 'muted addr';
          addr.textContent = e.address;
          main.appendChild(addr);
        }
        if (e.notes) {
          const notes = document.createElement('div');
          notes.className = 'notes';
          notes.textContent = e.notes;
          main.appendChild(notes);
        }
        card.appendChild(main);

        const actions = document.createElement('div');
        actions.className = 'actionsRow';
        const mapsBtn = document.createElement('button');
        mapsBtn.textContent = '🗺️ Maps';
        mapsBtn.onclick = () => {
          const link = e.maps?.trim() || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((e.place||'') + ' ' + (e.address||''))}`;
          window.open(link, '_blank', 'noopener');
        };
        const copyBtn = document.createElement('button');
        copyBtn.textContent = '📋 Copy address';
        copyBtn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(e.address || '');
            copyBtn.textContent = '✅ Copied!';
            setTimeout(() => copyBtn.textContent = '📋 Copy address', 1200);
          } catch (err) { alert('Clipboard not available'); }
        };
        actions.append(mapsBtn, copyBtn);
        card.appendChild(actions);

        cards.appendChild(card);
      });

      empty.hidden = entries.length !== 0;
    }

    function formatTime(e) {
      if (e.start && e.end) return `${e.start} – ${e.end}`;
      if (e.start) return e.start;
      return 'Anytime';
    }

    function findNextIndex(list) {
      const now = new Date();
      const curMinutes = now.getHours() * 60 + now.getMinutes();
      let candidate = -1;
      list.forEach((e, idx) => {
        const mins = toMinutes(e.start);
        if (mins === null) return;
        if (mins >= curMinutes && candidate === -1) candidate = idx;
      });
      return candidate;
    }

    function toMinutes(timeStr) {
      if (!timeStr || !/^\d{1,2}:\d{2}$/.test(timeStr)) return null;
      const [h,m] = timeStr.split(':').map(Number);
      return h*60 + m;
    }

    function escapeHtml(str='') { return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

    function render() {
      renderTabs();
      const day = itinerary.find(d => d.id === activeDay) || itinerary[0];
      if (!day) return;
      renderCards(day);
      $('#empty').textContent = `No items for ${day.title || day.id}.`;
    }

    // Filters
    $$('.pill').forEach(p => p.onclick = () => {
      $$('.pill').forEach(x => x.setAttribute('aria-pressed', 'false'));
      p.setAttribute('aria-pressed', 'true');
      timeFilter = p.dataset.filter;
      render();
    });

    searchInput.addEventListener('input', render);

    // Reset
    $('#btnReset').onclick = () => {
      if (confirm('Clear saved data and restore sample trip?')) {
        itinerary = sampleData();
        saveData();
        activeDay = itinerary[0].id;
        render();
      }
    };

    // Export
    $('#btnExportCsv').onclick = () => download('taiwan-itinerary.csv', toCsv(itinerary));
    $('#btnExportJson').onclick = () => download('taiwan-itinerary.json', JSON.stringify(itinerary, null, 2));

    function toCsv(data) {
      const rows = [['Day','Date','StartTime','EndTime','PlaceName','Address','MapsLink','Notes']];
      data.forEach((d, i) => d.entries.forEach(e => {
        rows.push([
          d.title || `Day ${i+1}`,
          d.date || '',
          e.start || '',
          e.end || '',
          e.place || '',
          e.address || '',
          e.maps || '',
          e.notes || ''
        ]);
      }));
      return rows.map(r => r.map(cell => '"' + String(cell).replace(/"/g,'""') + '"').join(',')).join('\n');
    }

    function download(filename, text) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      a.download = filename;
      a.click();
    }

    // Import flow
    $('#btnImport').onclick = () => importDialog.showModal();
    $('#closeImport').onclick = () => importDialog.close();
    $('#cancelImport').onclick = () => { mapSection.hidden = true; importError.textContent = ''; };

    $('#fetchCsv').onclick = async () => {
      const url = $('#csvUrl').value.trim();
      if (!url) return alert('Paste a CSV URL first');
      try {
        const res = await fetch(url);
        const text = await res.text();
        handleCsvText(text);
      } catch (e) { importError.textContent = 'Could not fetch URL. Make sure it is published as CSV.'; }
    };

    $('#useText').onclick = () => {
      const text = $('#csvText').value.trim();
      if (!text) return alert('Paste some CSV content');
      handleCsvText(text);
    };

    $('#csvFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      file.text().then(handleCsvText);
    });

    let pendingRows = [];
    let headers = [];

    function handleCsvText(text) {
      const { rows, header } = parseCsv(text);
      if (!rows.length) { importError.textContent = 'No data rows found.'; return; }
      pendingRows = rows;
      headers = header;
      buildMapper();
    }

    const fields = [
      { key: 'day', label: 'Day (or Date)', required: false },
      { key: 'date', label: 'Date (optional)', required: false },
      { key: 'start', label: 'StartTime', required: false },
      { key: 'end', label: 'EndTime', required: false },
      { key: 'place', label: 'PlaceName', required: true },
      { key: 'address', label: 'Address', required: true },
      { key: 'maps', label: 'MapsLink', required: false },
      { key: 'notes', label: 'Notes', required: false },
    ];

    function buildMapper() {
      mapSection.hidden = false;
      mapGrid.innerHTML = '';
      importError.textContent = '';
      preview.textContent = 'Preview first row: ' + JSON.stringify(pendingRows[0]);

      fields.forEach(f => {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        wrap.innerHTML = `<label>${f.label}${f.required ? ' *' : ''}</label>`;
        const sel = document.createElement('select');
        sel.dataset.key = f.key;
        sel.innerHTML = '<option value="">-- none --</option>' + headers.map(h => `<option value="${h}">${h}</option>`).join('');
        sel.value = guessColumn(f.key) || '';
        wrap.appendChild(sel);
        mapGrid.appendChild(wrap);
      });
    }

    function guessColumn(key) {
      const map = { day: ['day','date','ngay'], date: ['date'], start: ['start','time','begin'], end: ['end','finish'], place: ['place','location','spot','ten'], address: ['address','addr','dia'], maps: ['map','google'], notes: ['note','ghi'] };
      const targets = map[key] || [];
      const lower = headers.map(h => h.toLowerCase());
      const found = targets.map(t => lower.indexOf(t)).find(i => i >= 0);
      return found >= 0 ? headers[found] : '';
    }

    $('#confirmImport').onclick = () => {
      importError.textContent = '';
      const mapping = {};
      $$('#mapGrid select').forEach(sel => mapping[sel.dataset.key] = sel.value);

      if (!mapping.place || !mapping.address) {
        importError.textContent = 'PlaceName and Address are required.';
        return;
      }

      const transformed = buildItineraryFromRows(pendingRows, mapping);
      if (!transformed.length) { importError.textContent = 'No valid rows after mapping.'; return; }
      itinerary = transformed;
      saveData();
      activeDay = itinerary[0].id;
      render();
      importDialog.close();
      mapSection.hidden = true;
      alert('Import successful!');
    };

    function buildItineraryFromRows(rows, mapping) {
      const items = rows.map(r => {
        const place = r[mapping.place];
        const address = r[mapping.address];
        if (!place || !address) return null;
        const obj = {
          place: place.trim(),
          address: address.trim(),
          start: (r[mapping.start] || '').trim(),
          end: (r[mapping.end] || '').trim(),
          maps: (r[mapping.maps] || '').trim(),
          notes: (r[mapping.notes] || '').trim(),
        };
        const dayVal = r[mapping.day] || '';
        const dateVal = r[mapping.date] || '';
        return { dayVal: dayVal.trim(), dateVal: dateVal.trim(), entry: obj };
      }).filter(Boolean);

      if (!items.length) return [];

      // derive days
      let dayGroups = new Map();
      let orderedDates = [];

      items.forEach((row, idx) => {
        let key = row.dayVal || '';
        if (!key && row.dateVal) {
          key = row.dateVal;
          orderedDates.push(row.dateVal);
        }
        if (!key) key = 'Day 1';
        const id = 'day-' + key.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'day1';
        if (!dayGroups.has(id)) dayGroups.set(id, { id, title: key || 'Day ' + (dayGroups.size+1), date: row.dateVal || '', entries: [] });
        dayGroups.get(id).entries.push(row.entry);
      });

      // If no explicit day but dates exist, sort by date
      const arr = Array.from(dayGroups.values());
      arr.sort((a,b) => (a.date||'') > (b.date||'') ? 1 : -1);
      arr.forEach((d, i) => { d.id = `day${i+1}`; d.title = d.title || `Day ${i+1}`; });
      arr.forEach(d => d.entries.sort((a,b) => (a.start||'') > (b.start||'') ? 1 : -1));

      // fill maps when missing
      arr.forEach(d => d.entries.forEach(e => {
        if (!e.maps) e.maps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((e.place||'') + ' ' + (e.address||''))}`;
      }));

      return arr;
    }

    function parseCsv(text) {
      const lines = [];
      let cur = '', inQuotes = false;
      const rows = [];
      let row = [];
      for (let i=0;i<text.length;i++) {
        const c = text[i];
        if (c === '"') {
          if (inQuotes && text[i+1] === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          row.push(cur.trim()); cur='';
        } else if ((c === '\n' || c === '\r') && !inQuotes) {
          if (cur !== '' || row.length) { row.push(cur.trim()); rows.push(row); row=[]; cur=''; }
        } else {
          cur += c;
        }
      }
      if (cur !== '' || row.length) { row.push(cur.trim()); rows.push(row); }
      const header = rows.shift() || [];
      const normalizedRows = rows.map(r => Object.fromEntries(header.map((h,i) => [h, r[i] || ''])));
      return { header, rows: normalizedRows };
    }

    render();
  </script>
